# 大肥鯨一個 compose —— 一個 service。
#
#   router   外殼 + 個腦（dafeijing/router 直接 spawn dsh）
#
# ```
# Telegram → router → dsh（SDK stdio）→ OpenRouter
# ```
#
# 貝爾法斯特（belfast / router-belfast）2026-10-21 已搬走。
#
# ## 為什麼 Router 唔再喺主機行
#
# 以前係「Docker（腦）+ 主機 process（外殼）」，兩邊要各自開、各自睇。
# 收埋一個 compose 之後 `restart: unless-stopped` 會自己處理重啟，
# 唔使再靠看守程序或者某個 session 開住個 shell。
#
# ## 網絡
#
# Router 同 dsh 同一個 container（dsh 係 Router 嘅子進程），
# 所以唔使 service name、亦唔使開任何 port。

services:
  # ── 大肥鯨 ─────────────────────────────────────────
  # 個腦：DeepSeek Harness（2026-10-20 由 Hermes 換過嚟）。
  #
  # ⚠️ **dsh 而家係 Router 嘅子進程，唔再係獨立 service。**
  # 之前試過 HTTP API，但 dsh 個 web 有 process-scoped 認證
  # （launchToken 每條 process 隨機、cookie 綁 in-memory peer、
  #  Config 冇開關可以關），要每次重啟刮 log —— 太脆。
  # 改用 SDK（stdio JSON-RPC），Router 直接 spawn 佢。
  #
  # 所以 `dsh/` 個 image 變咗 Router 個 image 嘅一部分 ——
  # 見 repo 根 Dockerfile。
  router:
    build: .
    container_name: router
    restart: unless-stopped

    # ⚠️ **行 root，唔用 image 預設嘅 `whale`（uid 1000）。**
    #
    # Router 要寫入幾個 host 目錄，擁有者唔同：
    #   ./data、./logs                      root:root 777   → 任何 uid 都得
    #   ./data/videos                       影片 cache
    #   ./dsh/data                          dsh 自己嘅 session / attachment
    #
    # videos 目錄係舊 Hermes 容器建嘅（uid 10000），
    # 而 700 連讀都唔得。行 root 係最簡單而又唔使 chown 嚟 chown 去嘅做法
    # —— 兩隻 bot 嘅檔案擁有者唔一致，硬砌一個 uid 只會兩邊都撞。
    #
    # 呢個容器冇對外開任何 port（只係出去 polling Telegram），所以風險有限。
    user: "0:0"

    # CWD = repo 根 → `settings.py` 嘅 `env_file=".env"` 讀到 .env（共用調校）
    working_dir: /app

    # 同主機一樣嘅分工：`.env` 提供共用調校，`.env.router` 蓋過佢。
    env_file:
      - .env
      - .env.router

    environment:
      - TZ=${TZ:-Asia/Hong_Kong}
      - PYTHONIOENCODING=utf-8
      # pi-ai 個 openrouter provider 用呢條讀金鑰。
      - OPENROUTER_API_KEY=${FW_OPENROUTER_API_KEY}
      # dsh SDK profile 嘅家（session、attachments）。
      - DSH_HOME=/opt/dsh
      # 人設來源 —— entrypoint 由呢度讀入 persona。
      # ⚠️ 要對返真正嘅掛載點（`/opt/dsh-src/SOUL.md`），
      #    profile 目錄入面冇 SOUL.md。
      - DSH_SOUL=/opt/dsh-src/SOUL.md
      # ── 瀏覽器工具（dsh-browser-tool）──────────────
      # 用 apt 裝嘅 Chromium，唔好自動下載（容器內下載又慢又大）。
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DSH_BROWSER_INSTALL_CHROME=0
      - DSH_BROWSER_HEADLESS=1
      # 截圖落盤（掛載出去方便除錯）。
      - DSH_BROWSER_SCREENSHOT_DIR=/app/data/browser-shots
      # ⚠️ Router 會喺訊息入面寫「檔案喺 <呢個路徑>」，叫模型用
      # `video_analyze` 睇。所以一定要係 **dsh 容器內真正讀得到** 嘅路徑。
      # 舊預設 `/opt/data/cache/videos` 係 Hermes 年代嘅容器路徑，
      # 喺呢個 container 唔存在。
      - FW_HERMES_MEDIA_PREFIX=/app/data/videos
      # ── Google Maps MCP ────────────────────────────────
      # 有 GOOGLE_MAPS_API_KEY 就自動掛自寫嘅新版 API server
      # （`dsh/mcp/google_maps_server.py`）；冇就完全唔掛。
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # HasData 係後備（帳戶 under review）。有 Google key 時佢會被忽略。
      - HASDATA_API_KEY=${HASDATA_API_KEY:-}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # ⚠️ **唔好掛成個 `$DSH_HOME`。**
      #
      # 之前掛 `./dsh/data:/opt/dsh`，令 image 入面 build 好嘅
      # `profiles/fatwhale-sdk/node_modules` 被 host 蓋走。每次加 plugin
      # 都要由 image 複製幾千個檔案去 Windows bind mount —— 實測會卡死
      # 幾分鐘以上（Docker Desktop 嘅 bind mount 對大量細檔案極慢）。
      #
      # 所以而家只掛**執行期資料**，`profiles/` 留喺 image：
      - ./dsh/data/sessions:/opt/dsh/sessions
      - ./dsh/data/attachments:/opt/dsh/attachments
      - ./dsh/data/storages:/opt/dsh/storages
      # 人設：`dsh/persona/SOUL.md`（由 build_soul.py 生成、已追蹤）。
      # ⚠️ 路徑要對返 entrypoint 嘅 `DSH_SOUL` 預設值。
      - ./dsh/persona/SOUL.md:/opt/dsh-src/SOUL.md:ro
      # 影片：Router 寫入呢度（`router/videos.py` 仲用緊呢個路徑）。

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ⚠️ Router 個 image 係 build 出嚟嘅，改咗 dafeijing/ 或者 dsh/ 之後要重建：
#     docker compose up -d --build router
